        <h1>Umeed Care Center — Orthotic &amp; Prosthetic Clinic in Karachi</h1>
        <p>Umeed Care Center is a leading orthotic and prosthetic clinic in Karachi, Pakistan. We provide a complete range of expert services under one roof — from prosthetic limbs and custom orthotics to spinal braces and diabetic footwear. Our compassionate team serves patients of all ages, from children taking their first steps to elderly patients rediscovering the joy of walking.</p>

        <h2>Our Services</h2>
        <ul>
          <li><strong>Lower Limb Prosthetics</strong> — Custom prosthetic legs and feet for patients with lower limb amputation.</li>
          <li><strong>Upper Limb Prosthetics</strong> — Functional prosthetic arms and hands for daily independence.</li>
          <li><strong>Pediatric Orthotics &amp; Prosthetics</strong> — Specialist solutions for children's growing bodies.</li>
          <li><strong>Spinal Orthotics</strong> — Back braces and spinal supports for scoliosis and spinal conditions.</li>
          <li><strong>Lower Limb Orthotics</strong> — Ankle-foot orthoses (AFO), knee braces, and leg supports.</li>
          <li><strong>Upper Limb Orthotics</strong> — Wrist splints, elbow braces, and hand orthoses.</li>
          <li><strong>Custom Foot Orthotics</strong> — Insoles and arch supports tailored to your feet.</li>
          <li><strong>Diabetic &amp; Pressure-Relief Footwear</strong> — Specialist sandals and shoes for diabetic patients.</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <p><strong>Do you treat patients from outside Karachi?</strong> Yes, we regularly see patients travelling from other cities across Sindh and Pakistan.</p>
        <p><strong>Do you provide care for children?</strong> Yes, our pediatric orthotics and prosthetics program is designed for infants, children, and teenagers.</p>
        <p><strong>How do I book a consultation?</strong> Message us on WhatsApp and we'll confirm a convenient appointment time.</p>
